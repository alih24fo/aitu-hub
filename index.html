/* ======================== CAMPUS MAP (real floor plans) ========================
   Floor plans of block C1 (C1.1, C1.2, C1.3), floors 1–3, from the open-source
   project "aitumap" by Yuujiso (MIT License) — see THIRD_PARTY_LICENSES.txt.
   Every room is an SVG group with data-name = room code, e.g. "C1.3.319P".   */
const MAP = window.AITU_MAP || null;
const ROOM_TYPES = {P:"Practice room", L:"Lecture hall", K:"Computer lab"};

/* Search index over all floors: [{name, label, floor}] */
const MAP_INDEX = (() => {
  if(!MAP) return [];
  const out = [];
  for(const [floor, svg] of Object.entries(MAP.floors)){
    for(const m of svg.matchAll(/data-name="([^"]+)"/g)){
      const name = m[1];
      if(/^C\d\.\d$/.test(name) || /^\d\.\d+[A-Z]?$/.test(name)) continue;   // block labels / stray ids
      out.push({name, label: name.split("|")[0], floor: Number(floor)});
    }
  }
  return out;
})();

/* "C1.3.319" -> {block:"C1.3", floor:3, num:"319"} */
function parseRoom(code){
  const m = String(code||"").trim().toUpperCase().match(/^(C\d\.\d)\.(\d)(\d+)([A-Z]?)$/);
  return m ? {block:m[1], floor:Number(m[2]), num:m[2]+m[3], type:m[4]} : null;
}
/* find the map entry for a room code from the database */
function findRoomOnMap(code){
  if(!code) return null;
  const c = String(code).toUpperCase().replace(/\s+/g, "").replace(/[-_/]/g, ".");
  const candidates = [c];
  // "C1.1.3.366" (block . floor . room)  ->  "C1.1.366"
  // "C1.1.3.66"  (block . floor . short) ->  "C1.1.366"
  const m = c.match(/^(C\d\.\d)\.(?:(\d)\.)?(\d{1,3})([A-Z]?)$/);
  if(m){
    let num = m[3];
    if(m[2] && num.length < 3) num = m[2] + num.padStart(2, "0");
    candidates.push(`${m[1]}.${num}${m[4]}`, `${m[1]}.${num}`);
  }
  for(const cand of candidates){
    const hit = MAP_INDEX.find(e => e.label === cand || (e.label.length === cand.length + 1 && e.label.startsWith(cand) && /[A-Z]$/.test(e.label)));
    if(hit) return hit;
  }
  return null;
}
const FACILITIES = {
  DININGHALL:  {title:"Dining hall",     sub:"Асхана · Столовая · floor 1", alias:"CANTEEN CAFE CAFETERIA FOOD EAT LUNCH КАФЕ ЕДА"},
  MEDIKER:     {title:"Medical centre",  sub:"Mediker · Медпункт · floor 1", alias:"MEDICAL DOCTOR NURSE CLINIC HEALTH МЕДПУНКТ ВРАЧ"},
  LIBRARY:     {title:"Library",         sub:"Кітапхана · Библиотека · Медиатека · floor 1", alias:"BOOKS MEDIATEKA"},
  ASSEMBLYHALL:{title:"Assembly hall",   sub:"Актовый зал · floor 1", alias:"HALL AUDITORIUM EVENTS ЗАЛ"},
  ATAMEKEN:    {title:"Atameken coworking", sub:"Атамекен · floor 1", alias:"COWORKING"}
};
/* text that search looks at: code + all names + aliases */
function searchText(e){ const f = FACILITIES[e.label]; return (e.name + " " + (f ? f.title + " " + f.alias : "")).toUpperCase(); }
function prettyLabel(label){ return FACILITIES[label]?.title || label; }
function describeRoom(name){
  const label = name.split("|")[0];
  if(FACILITIES[label]) return FACILITIES[label];
  const p = parseRoom(label);
  if(!p) return {title: label.replace(/_/g," "), sub: "Campus facility"};
  return {title: label, sub: `Block ${p.block} · floor ${p.floor}` + (ROOM_TYPES[p.type] ? ` · ${ROOM_TYPES[p.type]}` : "")};
}

/* Reusable pan/zoom map viewer */
function createMapViewer(container, {floor = 1, onRoomClick = null, compact = false} = {}){
  if(!MAP){ container.innerHTML = `<div class="banner warn">Map data (map-data.js) is missing.</div>`; return null; }
  const [bx, by, bw, bh] = MAP.viewBox.split(" ").map(Number);
  const base = {x:bx, y:by, w:bw, h:bh};
  let vb = {...base}, cur = floor, anim = null;
  container.classList.add("cm"); if(compact) container.classList.add("compact");
  container.innerHTML = `
    <svg class="cm-svg" viewBox="${MAP.viewBox}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="AITU campus floor plan"></svg>
    <div class="cm-zoom">
      <button type="button" data-z="in" title="Zoom in">+</button>
      <button type="button" data-z="out" title="Zoom out">−</button>
      <button type="button" data-z="reset" title="Show whole floor">⤢</button>
    </div>
    <div class="cm-badge"></div>
    ${compact ? "" : `<div class="cm-hint">Scroll to zoom · drag to move · click a room</div>`}`;
  const badge = container.querySelector(".cm-badge");
  const setBadge = room => { const p = room && parseRoom(room.split("|")[0]); badge.textContent = (p ? `Block ${p.block} · ` : "") + `Floor ${cur}`; };
  const svg = container.querySelector("svg");
  const apply = () => svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const clampVb = v => {
    const w = Math.min(Math.max(v.w, base.w/10), base.w*1.3), h = w * base.h / base.w;
    const cx = v.x + v.w/2, cy = v.y + v.h/2;
    const ncx = Math.min(Math.max(cx, base.x), base.x+base.w), ncy = Math.min(Math.max(cy, base.y), base.y+base.h);
    return {x:ncx - w/2, y:ncy - h/2, w, h};
  };
  const animateTo = (target, ms = 380) => {
    target = clampVb(target);
    cancelAnimationFrame(anim);
    const from = {...vb}, t0 = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 3);
    const step = t => {
      const k = Math.min(1, (t - t0) / ms), e = ease(k);
      vb = {x:from.x+(target.x-from.x)*e, y:from.y+(target.y-from.y)*e, w:from.w+(target.w-from.w)*e, h:from.h+(target.h-from.h)*e};
      apply(); if(k < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  };
  const toSvg = (cx, cy) => { const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
  const zoomAt = (factor, cx, cy, smooth = false) => {
    const p = cx == null ? {x: vb.x+vb.w/2, y: vb.y+vb.h/2} : toSvg(cx, cy);
    const w = Math.min(Math.max(vb.w * factor, base.w/10), base.w*1.3);
    factor = w / vb.w;
    if(Math.abs(factor - 1) < 1e-6) return;            // already at the zoom limit: do nothing
    const h = vb.h * factor;
    const next = {x: p.x - (p.x - vb.x) * factor, y: p.y - (p.y - vb.y) * factor, w, h};
    if(smooth) animateTo(next, 220); else { vb = clampVb(next); apply(); }
  };
  svg.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.deltaY > 0 ? 1.15 : 1/1.15, e.clientX, e.clientY); }, {passive:false});
  let drag = null, moved = false;
  const touches = new Map(); let pinchDist = 0;           // two-finger pinch zoom on phones
  const tDist = () => { const [a, b] = [...touches.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  svg.addEventListener("pointerdown", e => {
    touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(touches.size === 2){ pinchDist = tDist(); drag = null; moved = true; return; }
    drag = {x:e.clientX, y:e.clientY, vb:{...vb}, id:e.pointerId}; moved = false; cancelAnimationFrame(anim);
  });
  svg.addEventListener("pointermove", e => {
    if(touches.has(e.pointerId)) touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(touches.size === 2){
      const d = tDist(); if(pinchDist && d){ const [a, b] = [...touches.values()]; zoomAt(pinchDist / d, (a.x+b.x)/2, (a.y+b.y)/2); }
      pinchDist = d; return;
    }
    if(!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if(Math.abs(dx) + Math.abs(dy) > 4 && !moved){ moved = true; svg.classList.add("dragging"); try{ svg.setPointerCapture(drag.id); }catch(_){} }
    if(!moved) return;
    const s = 1 / svg.getScreenCTM().a;
    vb = clampVb({...drag.vb, x: drag.vb.x - dx*s, y: drag.vb.y - dy*s}); apply();
  });
  const endDrag = e => { if(e && e.pointerId != null) touches.delete(e.pointerId); if(touches.size < 2) pinchDist = 0; drag = null; svg.classList.remove("dragging"); };
  svg.addEventListener("pointerup", endDrag); svg.addEventListener("pointercancel", endDrag); svg.addEventListener("lostpointercapture", endDrag);
  svg.addEventListener("click", e => {
    if(moved) return;
    const g = e.target.closest("[data-name]");
    if(!g || /^C\d\.\d$/.test(g.dataset.name)) return;
    api.select(g.dataset.name, {zoom:false});
    if(onRoomClick) onRoomClick(g.dataset.name);
  });
  container.querySelectorAll("[data-z]").forEach(b => b.onclick = () => {
    if(b.dataset.z === "in") zoomAt(1/1.4, null, null, true);
    else if(b.dataset.z === "out") zoomAt(1.4, null, null, true);
    else animateTo(base);
  });
  const groupFor = name => [...svg.querySelectorAll("[data-name]")].find(g => g.dataset.name === name);
  const api = {
    get floor(){ return cur; },
    setFloor(f, {keepView = false} = {}){
      cur = Number(f); svg.innerHTML = MAP.floors[cur] || ""; setBadge(null);
      container.querySelector(".cm-overlay")?.remove();
      if(!keepView){ vb = {...base}; apply(); }
    },
    clearMarks(cls = ["cm-target","cm-selected","cm-found"]){ svg.querySelectorAll("." + cls.join(",.")).forEach(g => g.classList.remove(...cls)); },
    mark(names, cls){ names.forEach(n => { const g = groupFor(n); if(g) g.classList.add(cls); }); },
    focus(name, {cls = "cm-target", zoom = true} = {}){
      const entry = MAP_INDEX.find(e => e.name === name);
      if(!entry) return false;
      if(entry.floor !== cur) api.setFloor(entry.floor);
      api.clearMarks([cls]);
      const g = groupFor(name); if(!g) return false;
      g.classList.add(cls); setBadge(name);
      if(zoom){
        // real on-screen box of the room -> map coordinates (works even when parent groups are transformed)
        const rc = g.getBoundingClientRect(), p1 = toSvg(rc.left, rc.top), p2 = toSvg(rc.right, rc.bottom);
        const b = (rc.width && rc.height) ? {x:p1.x, y:p1.y, width:p2.x - p1.x, height:p2.y - p1.y} : g.getBBox();
        const w = compact ? Math.max(b.width*14, base.w/2) : Math.max(b.width*7, base.w/3.2), h = w * base.h / base.w;
        animateTo({x: b.x + b.width/2 - w/2, y: b.y + b.height/2 - h/2, w, h});
      }
      return true;
    },
    select(name, opts = {}){ api.clearMarks(["cm-selected"]); return api.focus(name, {cls:"cm-selected", ...opts}); },
    reset(){ animateTo(base); },
    overlay(html){ container.querySelector(".cm-overlay")?.remove(); const d = document.createElement("div"); d.className = "cm-overlay"; d.innerHTML = html; container.appendChild(d); }
  };
  api.setFloor(floor);
  return api;
}

/* 7b. CAMPUS MAP — full interactive floor plan */
SCREENS.campus = async ({room} = {}) => {
  const u = state.user;
  setHeader("Campus Map", {showBack: state.history.length > 0}); setTabs("campus");
  const r = await load(`lessons_${u.student_id}`, () => lessonsWithLms(u.student_id));
  const lessons = r.data || [];
  const today = dayKey(now());
  const upcoming = lessons.filter(l => new Date(l.end_time || l.start_time) >= now()).slice(0, 6);
  const target = room ? findRoomOnMap(room) : null;
  const startFloor = target ? target.floor : (state.mapFloor || 1);

  $("#main").innerHTML = `
    <div class="row" style="gap:12px;flex-wrap:wrap;margin-bottom:12px">
      <div class="floor-btns" role="tablist" aria-label="Floor">
        ${[1,2,3].map(f => `<button data-floor="${f}" role="tab">Floor ${f}</button>`).join("")}
      </div>
      <form class="search-box" id="mapSearch" autocomplete="off">
        <span class="si">🔍</span>
        <input type="text" id="mapQ" placeholder="Find a room: 319, C1.3.319, canteen…" aria-label="Search room">
      </form>
    </div>
    <div class="results" id="mapResults"></div>
    <div class="map-layout" style="margin-top:8px">
      <div>
        <div id="bigMap" class="map-big"></div>
        <div class="legend">
          <span><i style="background:#8fb0f2"></i>Room</span>
          <span><i style="background:#d93a3a"></i>Your lesson</span>
          <span><i style="background:#1d8a52"></i>Selected</span>
          <span><i style="background:#f0b429"></i>Search result</span>
          <span><i style="background:#c9b3d3"></i>WC</span>
          <span><i style="background:#8fd3c0"></i>Medical</span>
          <span><i style="background:#f6c98f"></i>Dining hall</span>
          <span><i style="background:#b9a7e8"></i>Library</span>
          <span><i style="background:#cfd5df"></i>Stairs / service</span>
          <span class="credit">Floor plans: <a href="https://github.com/Yuujiso/aitumap" target="_blank" rel="noopener">aitumap</a> © Yuujiso (MIT)</span>
        </div>
      </div>
      <div>
        <div id="roomPanel"></div>
        <h3>Your next lessons</h3>
        ${upcoming.length ? upcoming.map(l => {
          const on = findRoomOnMap(l.room?.room_code);
          return `<div class="card clickable normal" data-locate="${esc(l.room?.room_code||"")}" ${on?"":'style="opacity:.7"'}>
            <div class="row between"><div class="title" style="font-size:15px">${esc(l.course_name)}</div><span class="pill blue">${esc(l.room?.room_code||"—")}</span></div>
            <div class="meta"><span>${dayKey(l.start_time)===today?"Today":fmtDate(l.start_time)}, ${fmtTime(l.start_time)}</span><span>${on?`Floor ${on.floor}`:"not on map"}</span></div></div>`;
        }).join("") : `<p class="muted">No upcoming lessons.</p>`}
      </div>
    </div>`;

  const panel = $("#roomPanel");
  const showRoom = name => {
    const d = describeRoom(name);
    const here = lessons.filter(l => findRoomOnMap(l.room?.room_code)?.name === name);
    const next = here.find(l => new Date(l.start_time) > now());
    panel.innerHTML = `<div class="card" style="border-left-color:var(--green)">
      <div class="row between"><div class="title" style="font-size:18px">🚪 ${esc(d.title)}</div><span class="pill green">Floor ${viewer.floor}</span></div>
      <div class="meta" style="margin-top:2px">${esc(d.sub)}</div>
      ${here.length ? `<div style="margin-top:10px;font-size:14px">You have <b>${here.length}</b> lesson(s) here.${next ? `<br>Next: <b>${esc(next.course_name)}</b>, ${fmtDT(next.start_time)}` : ""}</div>`
                    : `<div class="muted" style="margin-top:10px;font-size:13.5px">None of your lessons are in this room.</div>`}
    </div>`;
  };
  const viewer = createMapViewer($("#bigMap"), {floor:startFloor, onRoomClick: showRoom});
  if(!viewer) return;
  const setFloorBtns = () => document.querySelectorAll("[data-floor]").forEach(b => b.classList.toggle("active", Number(b.dataset.floor) === viewer.floor));
  const markLessons = () => {
    const names = lessons.filter(l => dayKey(l.start_time) === today && new Date(l.end_time || l.start_time) >= now())
                         .map(l => findRoomOnMap(l.room?.room_code)).filter(Boolean).map(e => e.name);
    viewer.mark(names, "cm-target");
  };
  const changeFloor = f => { viewer.setFloor(f); state.mapFloor = f; setFloorBtns(); markLessons(); };
  document.querySelectorAll("[data-floor]").forEach(b => b.onclick = () => changeFloor(Number(b.dataset.floor)));
  markLessons(); setFloorBtns();

  const locate = (entry, cls = "cm-selected") => {
    if(entry.floor !== viewer.floor){ viewer.setFloor(entry.floor); state.mapFloor = entry.floor; markLessons(); }
    setFloorBtns();
    viewer.select(entry.name);
    showRoom(entry.name);
  };
  if(target){ locate(target); }
  else if(room){ panel.innerHTML = `<div class="banner warn">Room <b>${esc(room)}</b> is not on the floor plan. The map covers blocks C1.1–C1.3, floors 1–3.</div>`; }
  else { panel.innerHTML = `<div class="banner info">Click any room on the map, or search for it above. Today's lessons are shown in red.</div>`; }

  document.querySelectorAll("[data-locate]").forEach(c => c.onclick = () => {
    const e = findRoomOnMap(c.dataset.locate);
    if(e) locate(e); else toast(`Room ${esc(c.dataset.locate)} is not on the floor plan.`);
  });

  /* search: "319", "C1.3.319", "319P", or a facility name like "столовая" / "dining" */
  const results = $("#mapResults");
  const doSearch = () => {
    const q = $("#mapQ").value.trim().toUpperCase();
    results.innerHTML = "";
    viewer.clearMarks(["cm-found"]);
    if(!q){ return; }
    const hits = MAP_INDEX.filter(e => /^\d+[A-Z]?$/.test(q)
        ? new RegExp("\\." + q + (/[A-Z]$/.test(q) ? "$" : "[A-Z]?$")).test(e.label)
        : searchText(e).includes(q));
    const more = Math.max(0, hits.length - 12); hits.length = Math.min(hits.length, 12);
    if(!hits.length){
      viewer.clearMarks(["cm-selected"]);
      panel.innerHTML = `<div class="banner warn">Nothing found for “<b>${esc(q)}</b>”.<br>Try a room number (<b>319</b>), a full code (<b>C1.3.319</b>) or a place: <b>dining hall</b>, <b>library</b>, <b>medical</b>.</div>`;
      return;
    }
    results.innerHTML = hits.map((h, i) => `<button class="chip" data-hit="${i}">${esc(prettyLabel(h.label))} · floor ${h.floor}</button>`).join("")
      + (more ? `<span class="muted" style="font-size:13px;align-self:center">+${more} more — type more of the code</span>` : "");
    results.querySelectorAll("[data-hit]").forEach(b => b.onclick = () => locate(hits[Number(b.dataset.hit)]));
    if(hits[0].floor !== viewer.floor) changeFloor(hits[0].floor);
    viewer.mark(hits.filter(h => h.floor === viewer.floor).map(h => h.name), "cm-found");
    if(hits.length === 1) locate(hits[0]);
  };
  let t; $("#mapQ").oninput = () => { clearTimeout(t); t = setTimeout(doSearch, 200); };
  $("#mapSearch").onsubmit = e => { e.preventDefault(); doSearch(); };
};

/* 8. OUTLOOK — recent emails (academic_item where source = Outlook) */
SCREENS.outlook = async () => {
  const u = state.user;
  setHeader("Outlook", {showBack:false}); setTabs("outlook"); loading();
  const run = async () => {
    const r = await load(`items_${u.student_id}`, () => itemsWithLms(u.student_id));
    const mails = (r.data || []).filter(i => i.source === "Outlook" || (i.item_type||"").toLowerCase() === "email")
                                .sort((a,b) => new Date(b.due_at) - new Date(a.due_at));
    $("#main").innerHTML = `${r.error ? errorBlock(r.error, run, r.cached) : ""}
      <p class="muted" style="margin:0 0 10px;font-size:13.5px">Recent emails from professors and AITU offices</p>
      ${mails.length ? `<div class="list-grid">${mails.map(itemCard).join("")}</div>` : `<div class="empty"><div class="big">📭</div>No emails yet.</div>`}`;
    bindItemCards(); bindRetry(run);
  };
  run();
};

/* 9. MY REMINDERS — read, cancel (UPDATE), delete (DELETE), mark sent (Q5) */
SCREENS.reminders = async () => {
  const u = state.user;
  setHeader("My Reminders", {showBack:false}); setTabs("reminders"); loading();
  const run = async () => {
    const r = await load(`rem_${u.student_id}`, () => DB().reminders(u.student_id));
    const rems = r.data || [];
    const due = rems.filter(x => x.status === "scheduled" && new Date(x.remind_at) < now());
    const groups = [["scheduled","Scheduled"],["sent","Sent"],["cancelled","Cancelled"]];
    const pill = s => ({scheduled:'<span class="pill blue">scheduled</span>', sent:'<span class="pill green">sent</span>', cancelled:'<span class="pill grey">cancelled</span>'}[s] || `<span class="pill grey">${esc(s)}</span>`);
    $("#main").innerHTML = `
      ${r.error ? errorBlock(r.error, run, r.cached) : ""}
      ${due.length ? `<div class="banner warn">⏱ ${due.length} reminder(s) reached their time.
         <button class="btn small secondary" id="markSent" style="margin-top:8px;background:#fff">Deliver push & mark as sent</button></div>` : ""}
      ${rems.length ? groups.map(([s,label]) => {
        const g = rems.filter(x => (x.status||"scheduled") === s); if(!g.length) return "";
        return `<h3>${label} (${g.length})</h3><div class="list-grid">` + g.map(x => `
          <div class="card ${s==="scheduled"?"normal":"past"}" style="${s==="scheduled"?"":"opacity:.85"}">
            <div class="row between"><div class="title">🔔 ${esc(x.reminder_title)}</div>${pill(s)}</div>
            <div class="meta"><span>${fmtDT(x.remind_at)}</span>${x.interval && x.interval!=="none"?`<span>${esc(x.interval)}</span>`:""}</div>
            <div class="row" style="margin-top:10px;gap:8px">
              ${s==="scheduled" ? `<button class="btn small secondary" data-cancel="${x.reminder_id}">Cancel reminder</button>` : ""}
              ${s!=="scheduled" ? `<button class="btn small danger" data-del="${x.reminder_id}">Delete</button>` : ""}
            </div></div>`).join("") + `</div>`;
      }).join("") : `<div class="empty"><div class="big">🔕</div>No reminders yet.<br>Open a deadline and click “Set Reminder”.</div>
         <button class="btn primary" id="toDl">Go to Deadlines</button>`}`;
    const td = $("#toDl"); if(td) td.onclick = () => go("deadlines", {}, {root:true});
    const ms = $("#markSent"); if(ms) ms.onclick = async () => {
      ms.disabled = true;
      try{ const rows = await DB().markDueSent(u.student_id);
           sqlToast(`UPDATE reminder SET status = 'sent'\nWHERE student_id = ${u.student_id} AND status = 'scheduled' AND remind_at < now();\n→ ${(rows||[]).length} row(s) updated`);
           (rows||[]).forEach(x => pushNotify("AITU Hub — Reminder", x.reminder_title)); run(); }
      catch(ex){ ms.disabled = false; toast("❌ " + esc(ex.message)); }
    };
    document.querySelectorAll("[data-cancel]").forEach(b => b.onclick = async () => {
      if(!await confirmModal({title:"Cancel this reminder?", text:"You will not get a push for it. You can set a new one any time.", okText:"Cancel reminder", danger:true})) return;
      try{ await DB().updateReminder(Number(b.dataset.cancel), {status:"cancelled"});
           if(showSqlOn()) sqlToast(`UPDATE reminder SET status = 'cancelled'\nWHERE reminder_id = ${b.dataset.cancel};`); else toast("Reminder cancelled."); run(); }
      catch(ex){ toast("❌ " + esc(ex.message)); }
    });
    document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      if(!await confirmModal({title:"Delete this reminder?", text:"It will be removed from the database. This cannot be undone.", okText:"Delete", danger:true})) return;
      try{ await DB().deleteReminder(Number(b.dataset.del));
           if(showSqlOn()) sqlToast(`DELETE FROM reminder\nWHERE reminder_id = ${b.dataset.del};`); else toast("🗑 Reminder deleted."); run(); }
      catch(ex){ toast("❌ " + esc(ex.message)); }
    });
    bindRetry(run);
  };
  run();
};

/* Simulated push for reminders whose time came (in-app) */
async function checkDueReminders(){
  if(!state.user) return;
  try{
    const rems = await DB().reminders(state.user.student_id);
    const due = rems.filter(x => x.status === "scheduled" && new Date(x.remind_at) < now());
    if(due.length) toast(`🔔 <span><b>${due.length} reminder(s) are due</b><br>Open <u>Reminders</u> to deliver them.</span>`, 4500);
  }catch(e){}
}

/* Reminder Scheduler (desktop): every 30 s, deliver reminders whose time has come.
   Shows a Windows notification and sets reminder.status = 'sent' in the database. */
let schedulerBusy = false;
async function reminderScheduler(){
  if(!state.user || schedulerBusy) return;
  schedulerBusy = true;
  try{
    const rems = await DB().reminders(state.user.student_id);
    const due = rems.filter(x => x.status === "scheduled" && new Date(x.remind_at) <= now()
                               && now() - new Date(x.remind_at) < 10*60000);   // only fresh ones (last 10 min)
    for(const r of due){
      await DB().updateReminder(r.reminder_id, {status:"sent"});
      pushNotify("AITU Hub — Reminder", `${r.reminder_title} (${fmtTime(r.remind_at)})`);
    }
    if(due.length && state.screen === "reminders") render();
  }catch(e){ /* offline: try again next time */ }
  finally{ schedulerBusy = false; }
}
setInterval(reminderScheduler, 30000);

/* PWA: offline app shell when opened from a website (not in the desktop app) */
if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* ------------------------------- start ------------------------------- */
if(state.user && sbConfig() && !getSession()){ state.user = null; store.del("hub_user"); }   // no valid session -> log in again
go(state.user ? "dashboard" : "login", {}, {root:true});
if(state.user){ setTimeout(checkDueReminders, 800); setTimeout(() => lmsAutoSync(), 1500); startLmsTimer(); setTimeout(smartCheck, 4000); }
try{ if("Notification" in window && Notification.permission === "default") Notification.requestPermission(); }catch(e){}
</script>
